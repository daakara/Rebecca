    <main class="contact-main">
        <div class="contact-left">
            <picture><source srcset="assets/images/Rebecca Nwose.jpeg" type="image/jpeg"><img src="assets/images/Rebecca Nwose.jpeg" alt="Rebecca Nwose - Photography Studio" loading="lazy"></picture>
        </div>
        <div class="contact-right">
            <h1>Contact Rebecca</h1>
            <form class="contact-form" action="https://formspree.io/f/meorgnbk" method="POST" novalidate="">
                <p class="form-note">Required fields are marked with <span aria-hidden="true">*</span></p>
                <!-- This hidden field tells Formspree where to redirect after submission -->
                <input type="hidden" name="_next" value="https://rebeccanwose.com/thank-you">
                <div class="form-group">
                    <label for="name">Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="name" name="name" required="" placeholder="Your Name" autocomplete="name" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" required="" placeholder="your.email@example.com" autocomplete="email" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+234 XXX XXX XXXX" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="subject">Subject <span aria-hidden="true">*</span></label>
                    <input type="text" id="subject" name="subject" required="" placeholder="What is this about?" autocomplete="off" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="message">Message <span aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="5" required="" placeholder="Your message..." aria-required="true"></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </main>
